; Supervisor config for the notification queue worker.
;
; Install:
;   1. Copy this file to /etc/supervisor/conf.d/tacgh-queue-worker.conf
;   2. Replace /path-to-app below with the actual deployment path (twice).
;   3. Replace the user "www-data" with whichever user should own the process
;      (usually the same user PHP-FPM/the web server runs as).
;   4. sudo supervisorctl reread
;      sudo supervisorctl update
;      sudo supervisorctl start tacgh-queue-worker:*
;
; To pick up code changes after a deploy, restart the workers so they load
; the new code (they hold the old code in memory otherwise):
;   sudo supervisorctl restart tacgh-queue-worker:*
; (or run `php artisan queue:restart`, which signals workers to finish their
; current job and exit; supervisor then restarts them automatically.)

[program:tacgh-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path-to-app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/path-to-app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path-to-app/storage/logs/queue-worker.log
stopwaitsecs=3600
